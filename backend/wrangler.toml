name = 'inkedbymars'
main = "src/worker.js"
compatibility_date = "2026-11-10"
compatibility_flags = ["nodejs_compat"]
workers_dev = true

[vars]
BREVO_SENDER_EMAIL = "migzcerv007@gmail.com"
BREVO_SMTP_USER = "af4831001@smtp-brevo.com"
CLIENT_URL = "https://inkedbymars.netlify.app"
FROM_EMAIL = "noreply@tattoo.com"
IG_API_VERSION = "v25.0"
INSTAGRAM_TOKEN_EXPIRES_AT = ""
INSTAGRAM_USER_ID = "17841418937727052"
JWT_COOKIE_EXPIRE = "7"
JWT_EXPIRE = "7d"
META_APP_ID = "2950022142002122"
NODE_ENV = "development"
PORT = "5000"
PUBLIC_MEDIA_BASE_URL = "https://inkedbymars.migzcerv007.workers.dev"
RATE_LIMIT_MAX = "100"
RATE_LIMIT_WINDOW_MS = "900000"
SEED_ADMIN_EMAIL = "marielle.cervantes@yahoo.com"
SEED_ADMIN_NAME = "mars"
SMTP_HOST = "smtp.mailtrap.io"
SMTP_PORT = "2525"

[[durable_objects.bindings]]
name = "DATABASE"
class_name = "DatabaseAPI"

[[migrations]]
tag = "v1"
new_sqlite_classes = ["DatabaseAPI"]

[[ratelimits]]
name = "UPLOAD_LIMITER"
namespace_id = "1001"
simple = { limit = 12, period = 60 }

[[ratelimits]]
name = "AUTH_LIMITER"
namespace_id = "1002"
simple = { limit = 10, period = 60 }

[[ratelimits]]
name = "API_LIMITER"
namespace_id = "1003"
simple = { limit = 120, period = 60 }

[triggers]
crons = ["*/5 * * * *"]

[observability]
enabled = true

[observability.logs]
enabled = true
head_sampling_rate = 1
invocation_logs = true
persist = true

[observability.traces]
enabled = false
head_sampling_rate = 1
persist = true

[observability.issue_detection]
enabled = false