# Storyboard proposals. Runtime timings and gates require verification.
motions:
  - id: "signature"
    element: "Entry signature and tattoo pen"
    purpose: "express brand"
    meaning: "Show the artist’s hand through the act of drawing."
    trigger: "Homepage entry and each refresh, including a cached portrait"
    start_state: "Gold stroke starts at the pen tip, with continuous forearm beyond the right viewport edge"
    end_state: "Lowercase mars complete, pen lifted and faded"
    duration_ms: 2500
    delay_ms: 220
    easing: "Gentle acceleration and deceleration along the traced path"
    stagger_ms: "0"
    dependencies: "Approved signature trace and optimized hand art"
    z_layers: "Entry overlay above hero"
    removal_cost: "Loses artist introduction only"
    mobile: "Reframe or omit the hand at narrow widths"
    reduced_motion: "Show completed mark immediately if a loader is needed"
    implementation: "SVG stroke and synchronized transform"
    performance_risk: "Asset weight and blocking LCP"
    acceptance_test: "Pen stays attached to the active stroke and the right edge masks the arm."

  - id: "handoff"
    element: "Signature, seal and hero"
    purpose: "orient"
    meaning: "Connect the drawn mark to the persistent studio identity."
    trigger: "Completed stroke rests for 270 ms; skip dismisses immediately"
    start_state: "Completed mark centered on wine background"
    end_state: "Mark lands inside upper-left wax seal, hero usable"
    duration_ms: 1150
    easing: "ease-out"
    stagger_ms: "0"
    dependencies: "Mounted seal target and rendered hero"
    z_layers: "Hero below moving mark, navigation above hero after landing"
    removal_cost: "Loses spatial continuity"
    mobile: "Measure seal target after responsive layout"
    reduced_motion: "Show final hero and seal immediately"
    implementation: "Animate measured translation and scale over the dissolving backdrop; crossfade lettering at landing"
    performance_risk: "Layout shifts during target measurement"
    acceptance_test: "No invented progress, replay on refresh, and keyboard reaches the hero promptly."

  - id: "navigation"
    element: "Calligraphic menu and page push"
    purpose: "orient and express brand"
    meaning: "Reveal studio destinations while holding the seal and menu control in place"
    trigger: "Menu button, close control or Escape on public pages"
    start_state: "Three tapered ink strokes and full-width page"
    end_state: "Handwritten X and sideways menu reveal along the moving page edge"
    duration_ms: 1050
    easing: "Custom cubic-bezier with overlapping ink and panel movement"
    stagger_ms: 120
    dependencies: "Native modal, CSS path interpolation and public layout"
    z_layers: "Modal above displaced page, close control above mask"
    removal_cost: "Loses page continuity and calligraphic feedback"
    mobile: "Retain a narrow page edge next to the menu"
    reduced_motion: "Apply final states immediately"
    implementation: "CSS path morph, clip-path, transforms and native focus handling"
    performance_risk: "Web engine differences in SVG path interpolation"
    acceptance_test: "Push and return on all public routes; keyboard focus returns on close"

  - id: "mosaic"
    element: "Selected work tiles and center lettering"
    purpose: "reveal narrative"
    meaning: "Introduce work through a lead image that gives way to a wider portfolio."
    trigger: "Native scroll into selected work"
    start_state: "Lead photo fills stage as it enters from below"
    end_state: "Surrounding tiles settle and made to be worn is fully drawn, then grid exits upward"
    scroll_range: "One viewport of scroll; hold 6%, pull back through 83%, rest before exit"
    easing: "linear scroll mapping"
    stagger_ms: "0"
    dependencies: "Reserved aspect ratios and placeholder tile art"
    z_layers: "Lettering above center image"
    removal_cost: "Loses sequencing; portfolio remains usable"
    mobile: "Responsive grid with measured cover scale; static composition under reduced motion"
    reduced_motion: "Show static grid and full heading"
    implementation: "CSS transforms and SVG or clip mask; use native scrolling"
    performance_risk: "Image decode and scroll-driven repaint"
    acceptance_test: "Center phrase completes, link and heading remain accessible, reverse scroll stays coherent."

  - id: "intro"
    element: "Red About panel and collage"
    purpose: "reveal narrative"
    meaning: "Bring Mars into focus after the portfolio montage."
    trigger: "Native scroll into About"
    start_state: "Rounded inset panel rises from below and expands to full width"
    end_state: "Full-width red panel with complete right-hand 3 × 3 collage"
    scroll_range: "Panel top crosses viewport bottom through 22% from top; art opens during expansion"
    easing: "linear scroll mapping with eased endpoints"
    stagger_ms: "0"
    dependencies: "Existing artist collage and reserved layout"
    z_layers: "Copy over panel; image within mask"
    removal_cost: "Loses the transition only"
    mobile: "Stack copy above collage"
    reduced_motion: "Render the final layout and collage immediately"
    implementation: "CSS transform and clip-path, avoid animated layout dimensions where possible"
    performance_risk: "Large masks and repaint"
    acceptance_test: "Text remains readable as collage lifts and corners square off."

  - id: "style-accordion"
    element: "Style tabs, description and photo"
    purpose: "confirm interaction"
    meaning: "Show how each tattoo style differs before asking for a booking."
    trigger: "Scroll through the pinned section or select a style button"
    start_state: "Previously expanded style"
    end_state: "Selected panel opens and its image is revealed"
    scroll_range: "0.95 viewport per style; hold, glide over previous panel, settle before exit"
    easing: "sine.inOut per panel with 450 ms scroll smoothing"
    stagger_ms: "0"
    dependencies: "Existing style images and accessible controls"
    z_layers: "Active image clipped inside panel"
    removal_cost: "Loses selection motion only"
    mobile: "Retain narrow vertical rails; stack photo above description within the open panel"
    reduced_motion: "Switch instantly"
    implementation: "Pinned track and scroll-scrubbed panel translations; the buttons seek stable reading positions"
    performance_risk: "Layout shifts and duplicate accessible text"
    acceptance_test: "All four styles work via touch and keyboard with no booking CTA in this section."

  - id: "booking-reveal"
    element: "Your idea, in ink heading, image and booking action"
    purpose: "direct attention"
    meaning: "Turn interest into an appointment request."
    trigger: "Native scroll after style section"
    start_state: "Same rounded inset panel rises below styles and expands to full width"
    end_state: "Photo reveals and booking action and process line are visible"
    scroll_range: "Panel top crosses viewport bottom through 22% from top; art opens during expansion"
    easing: "linear scroll mapping"
    stagger_ms: "0"
    dependencies: "Existing tattoo-pen image and /booking route"
    z_layers: "Image behind contrast scrim; action above"
    removal_cost: "Loses visual entrance only"
    mobile: "Stack copy, action and image; retain contrast"
    reduced_motion: "Show completed section immediately"
    implementation: "CSS clipping and native scroll; CTA remains in document order"
    performance_risk: "Image decode and hidden focus targets"
    acceptance_test: "Request a session works at first opportunity and is never held behind animation."


  - id: footer
    element: Studio footer and wordmark
    purpose: "reveal narrative and express brand"
    meaning: "Close the homepage with studio details and the Inked by Mars name"
    trigger: "Footer enters viewport"
    start_state: "Inset rounded footer and stationary wordmark"
    end_state: "Full-width footer and looping wordmark"
    scroll_range: "Entry through the first 48% of viewport travel"
    duration_ms: 24000
    easing: "Linear marquee and eased scroll reveal"
    stagger_ms: 0
    dependencies: "Existing seal, studio links and CSS view timeline"
    z_layers: "Marquee clipped below contact information"
    removal_cost: "Loses chapter continuity and moving wordmark"
    mobile: "Reflow contact links above marquee"
    reduced_motion: "Full-width footer and static wordmark"
    implementation: "CSS view timeline, CSS marquee and IntersectionObserver"
    performance_risk: "Large text layer; pause it offscreen"
    acceptance_test: "Footer links work, marquee pauses offscreen and reduced motion disables movement"

  - id: route-page-stack
    element: "Outgoing and incoming viewport snapshots"
    purpose: orient
    meaning: "One studio page moves upward to make room for the next"
    trigger: "Internal pathname change including history traversal"
    start_state: "Outgoing page fills viewport"
    end_state: "Incoming page fills viewport"
    duration_ms: 1450
    easing: "ease-in-out across shrink, slide, expand"
    stagger_ms: 0
    dependencies: "Browser View Transitions API"
    z_layers: "Two page snapshots over a dark backdrop"
    removal_cost: "Lose the spatial handoff between pages"
    mobile: "Same motion in viewport-relative units"
    reduced_motion: "Immediate navigation"
    implementation: "Same-document view transition around React route commit"
    performance_risk: "Two temporary viewport textures"
    acceptance_test: "Internal links and Back transition without replaying the signature"
